<link rel="preload" href="/_ds/leadfuse-design-system-e3be75cf-f7a5-414a-9771-ccf6955737da/assets/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>

<!-- No Meta pixel and no attribution relay on purpose: job applicants must never count as sales leads. -->
<style>
:root{--red:#E50011;--red-hi:#FF1524;--red-press:#AB000C;--bg:#050505;--line:rgba(255,255,255,.07);--glass:rgba(255,255,255,.04);--glass-line:rgba(255,255,255,.09);--ink:#fff;--ink2:rgba(255,255,255,.78);--ink3:rgba(255,255,255,.55);--sans:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Instrument Serif',Georgia,serif;--ease:cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--red);color:#fff}
a{color:var(--red)}a:hover{color:var(--red-hi)}
.s{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--red);letter-spacing:0}
@keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{font-family:var(--sans);font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:10px;border:1px solid transparent;white-space:nowrap;transition:all .24s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer}
.btn--md{font-size:13px;padding:14px 26px;min-height:48px}
.btn--solid{background:var(--red);color:#fff;box-shadow:0 0 40px rgba(229,0,17,.35),0 0 120px rgba(229,0,17,.15)}
.btn--solid:hover{background:var(--red-hi);color:#fff;box-shadow:0 0 50px rgba(229,0,17,.55),0 0 140px rgba(229,0,17,.25);transform:translateY(-2px)}
.btn--solid:active{transform:none;background:var(--red-press)}
.btn--solid[disabled]{opacity:.7;cursor:wait;transform:none}
.btn--ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.btn--ghost:hover{background:rgba(255,255,255,.08);color:#fff}
.btn:focus-visible,.back:focus-visible,.top a:focus-visible{outline:none;box-shadow:0 0 0 2px #000,0 0 0 4px var(--red)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}

.top{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(5,5,5,.85);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.top__bar{height:3px;background:rgba(255,255,255,.08)}
.top__bar i{display:block;height:100%;width:0;background:var(--red);box-shadow:0 0 12px rgba(229,0,17,.7);transition:width .35s var(--ease)}
.top__in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px}
.top__logo{display:block;padding:6px 0}.top__logo img{height:20px;width:auto;display:block}
.top__count{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}

.stage{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:100px 20px 56px}
@media (min-width:720px) and (min-height:680px){.stage{align-items:center;padding-top:110px}}
#form,.done{width:100%;max-width:680px}
.q{animation:qIn .32s var(--ease)}
.q--still{animation:none}
.q__num{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--red);letter-spacing:.06em}
.q__opt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:2px 9px}
.q__title{margin:10px 0 0;font-size:clamp(22px,5.6vw,30px);font-weight:700;line-height:1.28;letter-spacing:-.01em;color:#fff;text-wrap:pretty}
.q__hint{margin:10px 0 0;font-size:15px;line-height:1.55;color:var(--ink3);text-wrap:pretty}
.q__hint a{color:#fff}

.pre{margin:18px 0 0;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:18px 18px 16px}
.pre__h{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.pre ol{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.pre li{position:relative;padding-left:36px;font-size:15.5px;line-height:1.5;color:#fff}
.pre li b{position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--red);box-shadow:0 0 14px rgba(229,0,17,.45);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pre__meta{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--ink3)}
.pre__meta a{color:#fff}

.in{display:block;width:100%;margin-top:24px;background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.22);border-radius:0;padding:10px 2px;font-family:var(--sans);font-size:clamp(19px,4.8vw,24px);line-height:1.4;color:#fff;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.in::placeholder{color:rgba(255,255,255,.28)}
.in:focus{border-bottom-color:var(--red)}
.in--long{resize:none;overflow:hidden;min-height:54px}
.in--follow{margin-top:14px;font-size:19px;max-width:520px}

.opts{display:grid;gap:10px;margin-top:24px;max-width:520px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:52px;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);color:#fff;font-family:var(--sans);font-size:16px;line-height:1.35;transition:background .18s,border-color .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent}
.opt:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.32)}
.opt:focus-visible{box-shadow:0 0 0 2px #000,0 0 0 4px var(--red)}
.opt kbd{flex-shrink:0;width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink2);background:rgba(0,0,0,.35)}
.opt__l{flex:1;min-width:0}
.opt__tag{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(229,0,17,.18);border:1px solid rgba(229,0,17,.55);border-radius:999px;padding:3px 8px;white-space:nowrap}
.opt__ok{flex-shrink:0;opacity:0;transition:opacity .18s}
.opt[aria-checked=true]{background:rgba(229,0,17,.14);border-color:var(--red);box-shadow:0 0 20px rgba(229,0,17,.18)}
.opt[aria-checked=true] kbd{background:var(--red);border-color:var(--red);color:#fff}
.opt[aria-checked=true] .opt__ok{opacity:1}
.poolnote{margin:16px 0 0;max-width:520px;padding:12px 14px;border-left:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.03);font-size:14px;line-height:1.55;color:var(--ink2)}

.err{min-height:22px;margin:12px 0 0;font-size:14px;line-height:1.5;color:#FF5A66}
.act{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;margin-top:6px}
.act__hint{font-size:12.5px;color:var(--ink3)}
.act__hint b{color:var(--ink2);font-weight:600}
.back{all:unset;cursor:pointer;margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink3);padding:12px 4px;border-radius:8px}
.back:hover{color:#fff}
@media (pointer:coarse){.act__hint{display:none}}

.hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}

.done{text-align:center;animation:qIn .4s var(--ease)}
.done__ic{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--red);box-shadow:0 0 40px rgba(229,0,17,.6),0 0 0 6px rgba(229,0,17,.14);display:flex;align-items:center;justify-content:center}
.done h1{margin:28px 0 0;font-size:clamp(30px,7.4vw,48px);font-weight:800;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.done p{margin:16px auto 0;max-width:460px;font-size:clamp(16px,2.2vw,18px);line-height:1.65;color:var(--ink2)}
.done .btn{margin-top:30px}
.fallback{max-width:520px;margin:0 auto;padding:120px 20px;text-align:center;color:var(--ink2);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="top">
  <div class="top__bar" id="progress" role="progressbar" aria-label="Application progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
  <div class="top__in">
    <a class="top__logo" href="/careers/"><img src="/assets/logo-silver@4x.png" alt="LEADFUSE careers" width="113" height="20"></a>
    <span class="top__count" id="count"></span>
  </div>
</div>

<main class="stage">
  <form id="form" novalidate autocomplete="on">
    <div class="hp" aria-hidden="true"><label for="hp_site">Leave this empty</label><input id="hp_site" name="company_website" type="text" tabindex="-1" autocomplete="off"></div>
    <div id="q"></div>
  </form>
  <div class="done" id="done" hidden>
    <div class="done__ic"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true"><path d="M8 17.5l6 6L26.5 11" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1 tabindex="-1" id="done-h">Got it. Thanks for <em class="s">applying.</em></h1>
    <p>We read every application. If you're a fit, we'll email you an invite to a group call.</p>
    <a class="btn btn--ghost btn--md" href="/careers/">Back to careers</a>
  </div>
</main>

<noscript><div class="fallback">This application needs JavaScript turned on. Or email <a href="mailto:info@leadfuse.co">info@leadfuse.co</a> with the role you want and a link to your Loom.</div></noscript>

<script src="/careers/config.js?v=1"></script>
<script src="/careers/roles.js?v=1"></script>
<script src="/careers/apply/form.js?v=1"></script>
</body>
</html>
