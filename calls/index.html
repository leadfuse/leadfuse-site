<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Calls | LEADFUSE Academy</title>
<meta name="description" content="The three LEADFUSE Academy weekly calls. Add them to your calendar.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/a4e552f9.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}
body{font-family:Poppins,system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px}
main{width:100%;max-width:520px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#E50011;font-weight:700;margin-bottom:14px}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
.when{font-size:17px;color:#A7A7A7;line-height:1.5;margin-bottom:8px}
.about{font-size:15px;color:#818181;line-height:1.55;margin-bottom:30px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-weight:700;font-size:16px;padding:16px 20px;border-radius:12px;margin-bottom:12px;transition:background .15s}
.btn.red{background:#E50011;color:#fff}.btn.red:hover{background:#C9000F}.btn.red:active{background:#AB000C}
.btn.gray{background:#161616;color:#fff;border:1px solid #4D4D4D}.btn.gray:hover{background:#222}
.join{margin-top:22px;font-size:14px;color:#818181;line-height:1.6}
.join a{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.note{margin-top:34px;font-size:12px;color:#4D4D4D;line-height:1.6}
.list{display:flex;flex-direction:column;gap:12px}
.card{display:block;text-decoration:none;background:#161616;border:1px solid #4D4D4D;border-radius:14px;padding:18px 20px;color:#fff}
.card:hover{border-color:#818181}
.card b{display:block;font-size:17px;font-weight:700;margin-bottom:4px}
.card span{font-size:14px;color:#A7A7A7}
.back{display:inline-block;margin-bottom:22px;font-size:13px;color:#818181;text-decoration:none}
.back:hover{color:#fff}
@media(min-width:600px){h1{font-size:40px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">LEADFUSE Academy</div>
<h1>Weekly Calls</h1>
<p class="when">Three calls a week, all at 4:30 PM PT (7:30 PM ET), all on Google Meet. Pick one to add it to your calendar.</p>
<div class="list">
<a class="card" href="/calls/operations/"><b>Weekly Operations Call</b><span>Every Tuesday at 4:30 PM PT</span></a>
<a class="card" href="/calls/marketing/"><b>Weekly Marketing Call</b><span>Every Wednesday at 4:30 PM PT</span></a>
<a class="card" href="/calls/sales-training/"><b>Weekly Sales Training Call</b><span>Every Thursday at 4:30 PM PT</span></a>
</div>
</main>
</body>
</html>
